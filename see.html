<body>
<h1 style="text-align: center;">学科探究延伸站 (Subject Exploration Extensions / Hubs)</h1>
<iframe
  src="https://docs.google.com/document/d/1CY5Tt0kzVe5Wlwzo_cxJCdogxe4e0OXJRC1SWc_M_ow/preview"
  width="100%"
  height="800"
  style="border: none;">
</iframe>
<br>
  <h1 style="text-align: center;">

<p>Hits: <span id="github-counter">Loading...</span></p>

<!-- Trigger that tells the counter backend to add +1 globally -->
<img src="https://glitch.me" alt="Counter" style="display:none;">

<script>
  (async function() {
    const counterEl = document.getElementById('github-counter');
    const username = 'leeseklin';
    const repo = 'home'; // Make sure this matches your exact repository name
    
    try {
      // The '?t=' part stops the browser from caching old numbers
      const cacheBuster = `?t=${new Date().getTime()}`;
      const response = await fetch(`https://githubusercontent.com{username}/${repo}/main/see-views.txt${cacheBuster}`);
      
      if (response.ok) {
        const count = await response.text();
        // trim() cleans up any hidden spaces or new lines in the text file
        counterEl.innerText = Number(count.trim()).toLocaleString();
      } else {
        counterEl.innerText = 'File Not Found';
      }
    } catch (e) {
      counterEl.innerText = 'Unavailable';
    }
  })();
</script>

    
  </h1>

</body>
