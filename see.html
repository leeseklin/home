<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Welcome</title>
</head>
<body>
  <h1 style="text-align: center;">

<p>Hits4: 
  <span class="counterapi" 
        id="live-counter"
        ns="leeseklin-github-pages" 
        key="home-see"
        no-anim="true">
  </span>
</p>

<!-- The Core Counter API Script -->
<script src="https://counterapi.com/c.js"></script>

<!-- The Refresh Bypass Script -->
<script>
  window.addEventListener('load', () => {
    // 1. Target the counter element
    const counterSpan = document.getElementById('live-counter');
    
    // 2. Target the exact backend URL for your counter node
    const namespace = 'leeseklin-github-pages';
    const key = 'home-see';
    const forceHitUrl = `https://counterapi.com{namespace}/hit/${key}`;

    // 3. Silently trigger a raw server request in the background to add +1
    fetch(forceHitUrl)
      .then(response => response.json())
      .then(data => {
        // 4. Force the visible widget to immediately display the freshly updated number
        if (data && data.value !== undefined && counterSpan) {
          counterSpan.innerText = Number(data.value).toLocaleString();
        }
      })
      .catch(err => console.log('Bypass error:', err));
  });
</script>



  </h1>
  <br>

  <table align=center>
  </table>
</body>
</html>
