<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>学科探究延伸站 (Subject Exploration Extensions / Hubs)</title>
</head>
<body>
<h1 style="text-align: center;">学科探究延伸站 (Subject Exploration Extensions / Hubs)</h1>
<iframe
  src="https://docs.google.com/document/d/1NJo0hCWEvfbewDWeZvc68glYonXrqnkPtYiBcMWiuiQ/preview"
  width="100%"
  height="800"
  style="border: none;">
</iframe>
<br>  
  <h1 style="text-align: center;">
    
<p>Hits5: <span id="refresh-counter">0</span></p>

<script>
  (async function() {
    const counterEl = document.getElementById('refresh-counter');
    const namespace = 'leeseklin-github-pages';
    const key = 'home-see';
    const storageKey = `local_views_${namespace}_${key}`;

    // 1. Get your baseline starting number from the cloud database
    let cloudCount = 0;
    try {
      // Pull the baseline real count from the API
      const response = await fetch(`https://counterapi.com{namespace}/view/${key}?readOnly=true`);
      const data = await response.json();
      if (data && data.value !== undefined) {
        cloudCount = Number(data.value);
      }
    } catch (e) {
      console.log("Cloud read error, using local fallback.");
    }

    // 2. Track personal refreshes using the browser's LocalStorage memory
    let personalRefreshes = Number(localStorage.getItem(storageKey)) || 0;
    
    // Add +1 immediately because the page just loaded/refreshed
    personalRefreshes += 1;
    localStorage.setItem(storageKey, personalRefreshes);

    // 3. Fire a silent hit to the cloud so external visitors still register +1
    try {
      fetch(`https://counterapi.com{namespace}/hit/${key}`).catch(()=>{});
    } catch (e) {}

    // 4. Math: Display the master total (Cloud Baseline + Your current refreshes)
    const finalDisplayCount = cloudCount + personalRefreshes;
    counterEl.innerText = finalDisplayCount.toLocaleString();
  })();
</script>


  </h1>
  <br>

  </table>
</body>
</html>
