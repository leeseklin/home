<!-- Centered Visual Container for your H1 and Counter Together -->
<div style="text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px;">
  
  <h1>Welcome to My Website</h1>
  
  <!-- The Bulletproof Live Counter Widget -->
  <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 10px; color: #1f2937;">
    <span style="font-weight: 600; font-size: 14px;">Page Views:</span>
    <!-- The text inside this span will be updated automatically by the script -->
    <span id="visits" style="font-family: monospace; font-weight: 700; font-size: 15px; color: #2563eb;">Loading...</span>
  </div>

</div>

<!-- 1. The Callback Script: Handles the data safely when it arrives -->
<script>
  function handleCounterResponse(response) {
    const counterEl = document.getElementById('visits');
    if (response && response.value !== undefined) {
      counterEl.innerText = Number(response.value).toLocaleString();
    } else {
      counterEl.innerText = '0';
    }
  }
</script>

<!-- 2. The JSONP Request Script: Bypasses CORS blocks to count every refresh -->
<!-- Change 'leeseklin-github-pages' or 'home-see' to change your tracking keys -->
<script async src="https://counterapi.com"></script>
