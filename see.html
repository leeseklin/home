  <h1 style="text-align: center;">

<!-- Centered Visual Container for your H1 and Counter Together -->
<div style="text-align: center; font-family: system-ui, -apple-system, sans-serif; padding: 20px;">
  
  <h1>Welcome to My Website</h1>
  
  <!-- The Global Live Counter Widget -->
  <div style="display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; margin-top: 10px; color: #1f2937;">
    <span style="font-weight: 600; font-size: 14px;">Page Views:</span>
    <span id="global-counter" style="font-family: monospace; font-weight: 700; font-size: 15px; color: #2563eb;">Loading...</span>
  </div>

</div>

<!-- The Multi-Device Synced Tracking Logic -->
<script>
  (async function() {
    const counterEl = document.getElementById('global-counter');
    
    // A completely unique key specifically for your GitHub directory page
    const uniqueKey = 'leeseklin_github_io_home_see'; 
    
    // The 'hit' action forces the remote cloud database to add +1 instantly on every load
    const apiUrl = `https://mileshilliard.com{uniqueKey}`;

    try {
      const response = await fetch(apiUrl);
      const data = await response.json();
      
      // The open-source API updates and returns the value inside the data.value parameter
      if (data && data.value !== undefined) {
        counterEl.innerText = Number(data.value).toLocaleString();
      } else {
        counterEl.innerText = '1';
      }
    } catch (error) {
      console.error('Cloud synchronization error:', error);
      counterEl.innerText = 'Unavailable';
    }
  })();
</script>
