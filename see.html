<h1 style="text-align: center;">学科探究延伸站 (Subject Exploration Extensions / Hubs)</h1>
<iframe
  src="https://docs.google.com/document/d/1CY5Tt0kzVe5Wlwzo_cxJCdogxe4e0OXJRC1SWc_M_ow/preview"
  width="100%"
  height="800"
  style="border: none;">
</iframe>
<br>
  <h1 style="text-align: center;">
<p>1Hits: <span id="github-counter">Loading...</span></p>    
  </h1>

<img src="https://glitch.me" alt="Counter" style="display:none;">
<script>
  (async function() {
    const counterEl = document.getElementById('github-counter');
    // Replace with your exact GitHub Username and Repository Name
    const username = 'leeseklin';
    const repo = 'home'; // Or whatever your repo name is
    
    try {
      // Fetches the live text file from your GitHub repository
      const response = await fetch(`https://githubusercontent.com{username}/${repo}/main/see-views.txt`);
      if (response.ok) {
        const count = await response.text();
        counterEl.innerText = Number(count).toLocaleString();
      } else {
        counterEl.innerText = '1'; // Default if file doesn't exist yet
      }
    } catch (e) {
      counterEl.innerText = 'Unavailable';
    }
  })();
</script>
