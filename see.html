<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Welcome</title>
</head>
<body>
  <h1 style="text-align: center;">

    <!-- Visual Container for the Counter -->
<div style="font-family: system-ui, -apple-system, sans-serif; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 6px; color: #1f2937;">
  <span style="font-weight: 600; font-size: 14px;">Page Views:</span>
  <span id="view-counter" style="font-family: monospace; font-weight: 700; font-size: 15px; color: #2563eb;">Loading...</span>
</div>

<!-- Counter Script -->
<script>
  (async function() {
    // 1. CLEAN IDENTIFIER: Unique namespace and key for your page
    const namespace = 'leeseklin-github-pages'; 
    const key = 'home-see';
    const counterEl = document.getElementById('view-counter');
    
    // 2. CHECK SESSION: Prevents counting personal page refreshes
    const sessionKey = `visited_${namespace}_${key}`;
    const hasVisited = sessionStorage.getItem(sessionKey);
    
    // 3. TARGET ACTION: 'hit' increments by +1, 'view' only reads the data
    const action = hasVisited ? 'view' : 'hit';
    const apiUrl = `https://counterapi.com{namespace}/${action}/${key}`;

    try {
      const response = await fetch(apiUrl);
      const data = await response.json();
      
      // CounterAPI.com returns the value inside data.value
      if (data && data.value !== undefined) {
        counterEl.innerText = Number(data.value).toLocaleString();
        sessionStorage.setItem(sessionKey, 'true');
      } else {
        counterEl.innerText = '0';
      }
    } catch (error) {
      console.error('Counter error:', error);
      counterEl.innerText = 'Unavailable';
    }
  })();
</script>


  </h1>
  <br>

  <table align=center>
  </table>
</body>
</html>
