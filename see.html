<!DOCTYPE html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <link rel="stylesheet" href="styles/style.css"/>
  <title>Welcome</title>
</head>
<body>
  <h1 style="text-align: center;">

<p>Hits3: 
  <span class="counterapi" 
        id="my-counter"
        ns="leeseklin-github" 
        key="home-see" 
        behavior="vote">
  </span>
</p>

<!-- The CounterAPI Core Library -->
<script src="https://counterapi.com"></script>

<!-- Script to automatically trigger a +1 count on every page load -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // Forces the counter to submit a +1 count instantly on load
    setTimeout(() => {
      const counterEl = document.getElementById('my-counter');
      if (counterEl && typeof counterEl.increment === 'function') {
        counterEl.increment();
      } else {
        // Fallback: Dispatches a click event if the component uses standard click triggers
        counterEl.click();
      }
    }, 300); // 300ms delay to make sure the external script has finished loading
  });
</script>


  </h1>
  <br>

  <table align=center>
  </table>
</body>
</html>
